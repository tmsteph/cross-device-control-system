name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.2.${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore and validate release signing key
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "CAN_RELEASE=false" >> "$GITHUB_ENV"
            echo 'Signed release skipped: ANDROID_KEYSTORE_B64 and/or ANDROID_KEYSTORE_PASSWORD is missing.'
            exit 0
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/3dvr-release.jks"

          EXPECTED_SHA='4483a988a9cbbd6940397e25c06c30ba3138f94b23ac07983fc3855148b16df3'
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/3dvr-release.jks" | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo '::error::ANDROID_KEYSTORE_B64 does not match the 3DVR signing bootstrap keystore.'
            exit 1
          fi

          if ! keytool -list \
            -keystore "$RUNNER_TEMP/3dvr-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias 3dvr-companion >/dev/null 2>&1; then
            echo '::error::ANDROID_KEYSTORE_PASSWORD is not the password for the 3DVR signing keystore.'
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/3dvr-release.jks" >> "$GITHUB_ENV"
          echo "CAN_RELEASE=true" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 3dvr-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && env.CAN_RELEASE == 'true'
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release signature
        if: github.event_name != 'pull_request' && env.CAN_RELEASE == 'true'
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Publish update release
        if: github.event_name != 'pull_request' && env.CAN_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${VERSION_CODE}"
          APK="app/build/outputs/apk/release/3dvr-companion.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          for ATTEMPT in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$APK" --clobber && \
                 gh release edit "$TAG" \
                   --title "3DVR Companion ${VERSION_NAME}" \
                   --notes "Automatic signed 3DVR Companion update. Build ${VERSION_CODE}." \
                   --draft=false; then
                exit 0
              fi
            else
              if gh release create "$TAG" "$APK" \
                --target "$GITHUB_SHA" \
                --title "3DVR Companion ${VERSION_NAME}" \
                --notes "Automatic signed 3DVR Companion update. Build ${VERSION_CODE}."; then
                exit 0
              fi
            fi

            echo "GitHub release attempt ${ATTEMPT} failed; retrying..."
            sleep $((ATTEMPT * 5))
          done

          echo '::error::Could not publish the signed APK release after 3 attempts.'
          exit 1

      - name: Signing setup reminder
        if: github.event_name != 'pull_request' && env.CAN_RELEASE != 'true'
        run: |
          echo 'Release publishing skipped because Android signing secrets are not configured.'
          echo 'Required secrets: ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD.'
